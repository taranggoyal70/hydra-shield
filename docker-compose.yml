services:
  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    user: "${HYDRA_UID:-10001}:${HYDRA_GID:-10001}"
    ports:
      - "7687:7687"
      - "8443:8443"
      - "9090:9090"
    environment:
      CLOUD_PROVIDER: local
      LOCAL_PATH: /data/store
      GRAPH_NAMESPACE: hydrashield
      GRAPH_ID: default
      GRAPH_CELL_ID: cell-0
      GRAPH_CELLS: cell-0
      GRAPH_NODE_ID: node-0
      GRAPH_BOLT_NODE_ADDRESSES: node-0=127.0.0.1:7687
      GRAPH_ADVERTISED_BOLT_ADDR: 127.0.0.1:7687
      GRAPH_DATA_CACHE_DIR: /data/cache
      GRAPH_AUTH_TOKEN_FILE: /run/secrets/hydra_token
      GRAPH_ALLOW_PLAINTEXT: "true"
      RUST_MIN_STACK: "33554432"
    volumes:
      - ./.hydradb/store:/data/store
      - ./.hydradb/cache:/data/cache
    secrets:
      - hydra_token

secrets:
  hydra_token:
    file: ./.hydradb/auth-token
